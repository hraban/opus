on: [push, pull_request]
name: Test
jobs:
  full:
    strategy:
      matrix:
        go-version:
          - 1.24.x
          - 1.11.x
        platform:
          # Would like to test mac & win but not sure how to install opus on
          # those in GH actions, yet.
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}
    - name: Install system dependencies
      run: sudo apt-get install pkg-config libopus-dev libopusfile-dev moreutils
    - name: Checkout code
      uses: actions/checkout@v2
    # Could be a separate step but this is so quick--just put it here
    - name: Lint
      run: gofmt -d . | tee /dev/stderr | ifne false
    - name: Test
      run: go test -race -v ./...

  no-libopusfile:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.24.x
    - name: Install system dependencies
      run: sudo apt-get install pkg-config libopus-dev
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Test
      run: go test -tags nolibopusfile -race -v ./...

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: docker build --progress=plain -t latest -f Dockerfile.test .

  nocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "nocommit checker"
        uses: nobssoftware/nocommit@v3
